<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SekoupKiqs — Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#121D30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#8FA3BF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1040" cy="60" r="280" fill="url(#glow)"/>

  <rect x="80" y="96" width="4" height="150" rx="2" fill="url(#accent)"/>

  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <text x="116" y="124" font-size="17" font-weight="600" letter-spacing="6.5" fill="#2DD4BF">WEB DEVELOPER</text>
    <text x="114" y="200" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">SekoupKiqs</text>
    <text x="116" y="240" font-size="21" font-weight="400" fill="#94A3B8">TypeScript &#183; React &#183; Node &#183; Python</text>
  </g>
</svg>
